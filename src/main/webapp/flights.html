<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>フライト検索</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h2>🌍 My Travel Site</h2>
        <nav>
            <a href="index.html">ホーム</a> |
            <a href="flights.html">フライト</a> |
            <a href="hotels.html">ホテル</a> |
            <a href="signup.html">アカウント登録</a>
        </nav>
    </header>

    <div class="container">
        <h1>フライト検索</h1>
        <form action="#" method="get">
            <label for="from">出発地：</label>
            <input type="text" id="from" name="from">

            <label for="to">到着地：</label>
            <input type="text" id="to" name="to">

            <label for="date">出発日：</label>
            <input type="date" id="date" name="date">

            <button type="submit">検索</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 My Travel Site. All rights reserved.</p>
    </footer>
</body>
</html>
