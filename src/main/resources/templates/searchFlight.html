<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>フライト検索</title>
    <link rel="stylesheet" th:href="@{css/style.css}">
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- オプション：BootstrapのJS（モーダル・トグルなど使うなら） -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <h2>🌍 My Travel Site</h2>
        <nav>
            <a th:href="@{/}">ホーム</a> |
            <a th:href="searchFlight">フライト</a> |
            <a href="hotels.html">ホテル</a> |
            <a href="signup.html">アカウント登録</a>
        </nav>
    </header>

<div class="container mt-4">
  <h2>フライト検索</h2>

  <form method="post" th:action="@{/resultFlight}">
    <div class="mb-3">
      <label for="departure" class="form-label">出発地</label>
      <select class="form-select" id="departure" name="departure">
        <option th:each="dep : ${departures}" th:value="${dep}" th:text="${dep}"></option>
      </select>
    </div>

    <div class="mb-3">
      <label for="destination" class="form-label">目的地</label>
      <select class="form-select" id="destination" name="destination">
        <option th:each="dest : ${destinations}" th:value="${dest}" th:text="${dest}"></option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">検索</button>
  </form>
</div>
</body>
</html>
