<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>フライト検索</title>
    <link rel="stylesheet" th:href="@{css/style.css}">
</head>
<body>
    <header>
        <h2>🌍 My Travel Site</h2>
        <nav>
            <a th:href="@{/}">ホーム</a> |
            <a th:href="searchFlight">フライト</a> |
            <a href="hotels.html">ホテル</a> |
            <a href="signup.html">アカウント登録</a>
        </nav>
    </header>

<div class="container">
	<h1>フライト検索フォーム</h1>
		<form method="post" th:action="@{/resultFlight}" class="search-form">
		    出発地:
		    <input type="text" name="departure" list="departureList" class="search-input"><br>
			<datalist id="departureList">
			    <option th:each="dep : ${departures}" th:value="${dep}" th:text="${dep}"></option>
			</datalist>
		
		    目的地:
		    <input type="text" name="destination" list="destinationList" class="search-input"><br>
			<datalist id="destinationList">
			    <option th:each="dest : ${destinations}" th:value="${dest}" th:text="${dest}"></option>
			</datalist>
		    <br>
		    
		    <button type="submit">検索</button>
		</form>
</div>>
</body>
</html>
